<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Aligne sur le bleu de l'application et sur theme_color du manifest. -->
    <meta name="theme-color" content="#007AFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DomiTemps" />
    <meta name="description" content="Pointages, relevés CESU et factures pour les intervenants à domicile" />

    <!-- Le manifest existait dans public/ mais n'était référencé nulle part :
         sans ce lien, aucun navigateur ne le charge et l'installation reste dégradée. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignore le manifest pour l'icône. Sans apple-touch-icon, « Sur l'écran
         d'accueil » place une capture de la page en guise d'icône. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <title>DomiTemps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
